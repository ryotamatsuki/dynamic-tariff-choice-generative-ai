name: reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run frozen-theory regression and integrity gates
        run: make verify-python
      - name: Generate figure and table inputs
        run: make artifacts
      - name: Install LaTeX toolchain
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-pictures lmodern
      - name: Build manuscript scaffold
        run: make paper
      - name: Upload manuscript scaffold
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-scaffold
          path: paper/main.pdf

name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Baseline symbolic checks
        run: python verification/baseline_checks.py
      - name: Robustness checks
        run: python verification/robustness_checks.py
      - name: Repaired Stage 4A independent audit
        run: python verification/stage4a_repair_independent.py
      - name: Repaired Stage 7 welfare checks
        run: python verification/stage7_repaired_verify.py

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean toolchain
        run: elan toolchain install leanprover/lean4:v4.33.1
      - name: Resolve mathlib and obtain cache
        run: |
          lake update
          lake exe cache get
      - name: Build formal target
        run: lake build DynamicTariffFormal
      - name: Placeholder audit
        run: |
          if grep -R -n -E '\b(sorry|admit)\b' formal/*.lean; then
            echo 'Forbidden proof placeholder found.'
            exit 1
          fi
